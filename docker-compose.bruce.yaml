version: '3.8'

services:
  bruce:
    build:
      context: .
      dockerfile: Dockerfile.bruce
    container_name: hermes-gateway-bruce
    restart: unless-stopped
    networks:
      - hermes-network

    # Persistent volumes
    volumes:
      - bruce-home:/home/bruce
      - shared-vault:/home/shared/obsidian-vault:ro
      - ops-logs:/home/ubuntu/ops-logs

    # Environment variables
    environment:
      - HERMES_HOME=/home/bruce/.hermes
      - PLATFORM=telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_CHATS=${TELEGRAM_ALLOWED_CHATS}

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

# Named volumes
volumes:
  bruce-home:
  shared-vault:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/shared/obsidian-vault
  ops-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/ops-logs

# Network
networks:
  hermes-network:
    driver: bridge
