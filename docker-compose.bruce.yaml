services:
  bruce:
    build:
      context: .
      dockerfile: Dockerfile.bruce
    image: bruce-gateway
    container_name: hermes-gateway-bruce
    restart: unless-stopped
    networks:
      - hermes-network

    # Volumes
    volumes:
      - bruce-home:/home/bruce
      - /home/ubuntu/.hermes/hermes-agent:/opt/hermes-agent:ro
      - /home/shared/obsidian-vault:/home/shared/obsidian-vault:ro
      - /home/ubuntu/ops-logs:/home/ubuntu/ops-logs

    # Environment variables
    environment:
      - HERMES_HOME=/home/bruce/.hermes
      - PLATFORM=telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_CHATS=${TELEGRAM_ALLOWED_CHATS}
      - PYTHONPATH=/opt/hermes-agent

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

# Named volumes
volumes:
  bruce-home:
  ops-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/ops-logs

# Network
networks:
  hermes-network:
    driver: bridge